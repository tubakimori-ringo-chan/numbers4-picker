name: Auto Update Numbers 3 and 4 Data

on:
  schedule:
    # 月曜〜金曜の 11:45 UTC (= 日本時間 20:45) に実行
    - cron: '45 11 * * 1-5'
  workflow_dispatch: # GitHubの画面から手動実行できるようにする設定

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest Numbers 3 and 4 Data
        run: node scripts/update_numbers4.js

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/numbers3.json data/numbers4.json
          if git diff --staged --quiet; then
            echo "変更はありません。"
          else
            git commit -m "auto: ナンバーズ3・4最新当せん結果の更新"
            git push
          fi
